name: Deploy LostFinder to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Automated Tests & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite3, pdo_sqlite, zip, bcmath
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare Laravel Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite

      - name: Execute Feature & Unit Tests
        run: php artisan test

  deploy:
    name: Deploy to Hostinger via SSH
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Deployment Secrets
        run: |
          echo "🔍 Verifying required deployment secrets..."
          MISSING=0
          if [ -z "${{ secrets.HOSTINGER_SSH_HOST }}" ]; then
            echo "::error::Missing Secret: HOSTINGER_SSH_HOST"
            MISSING=1
          fi
          if [ -z "${{ secrets.HOSTINGER_SSH_USER }}" ]; then
            echo "::error::Missing Secret: HOSTINGER_SSH_USER"
            MISSING=1
          fi
          if [ -z "${{ secrets.HOSTINGER_SSH_PASSWORD }}" ] && [ -z "${{ secrets.HOSTINGER_SSH_KEY }}" ]; then
            echo "::error::Missing Secret: Provide either HOSTINGER_SSH_PASSWORD or HOSTINGER_SSH_KEY"
            MISSING=1
          fi
          if [ -z "${{ secrets.HOSTINGER_PROJECT_PATH }}" ]; then
            echo "::error::Missing Secret: HOSTINGER_PROJECT_PATH"
            MISSING=1
          fi

          if [ $MISSING -eq 1 ]; then
            echo "------------------------------------------------------------------"
            echo "❌ DEPLOYMENT STOPPED: Secrets missing in GitHub Repository."
            echo "👉 Go to: Repo -> Settings -> Secrets and variables -> Actions"
            echo "   and add the missing repository secrets."
            echo "------------------------------------------------------------------"
            exit 1
          fi
          echo "✅ All required deployment secrets are configured!"

      - name: Deploy to Hostinger Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          script_stop: true
          script: |
            cd "${{ secrets.HOSTINGER_PROJECT_PATH }}"
            echo "🚀 Starting LostFinder deployment on Hostinger..."
            
            echo "1. Checking git repository status..."
            if [ ! -d ".git" ]; then
              echo "Git repository not found in folder. Initializing..."
              git init
              git remote add origin https://github.com/ataussamadansari/LostFinder.git || git remote set-url origin https://github.com/ataussamadansari/LostFinder.git
              git fetch origin main
              git reset --hard origin/main
              git branch -M main
            else
              echo "Pulling latest commits from GitHub main branch..."
              git pull origin main
            fi
            
            echo "2. Installing optimized production dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction
            
            echo "3. Running database migrations..."
            php artisan migrate --force
            
            echo "4. Refreshing production caches..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            echo "5. Creating public storage symlink..."
            php artisan storage:link || true
            
            echo "✅ LostFinder successfully deployed on Hostinger!"
